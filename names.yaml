# ─────────────────────────────────────────────────────────────
#  음료 이름 짓기 단어장 — 자유롭게 단어를 추가/수정하세요!
# ─────────────────────────────────────────────────────────────
#  이름 = templates 중 하나를 골라 {빈칸}을 채워서 만듭니다.
#
#  빈칸 종류
#   {adj}      이 음료에서 가장 두드러진 맛의 형용사   (adjectives 에서)
#   {place}    그 맛과 어울리는 장소                   (places 에서)
#   {suffix}   음료 종류 이름 (포션, 에이드 …)         (suffixes 에서)
#   {mood}     조합이 잘 어울리면 harmony, 아니면 chaos 단어 (moods 에서)
#   {main}     가장 많이 들어간 음료의 별명 (drinks.yaml 의 nickname, 없으면 이름)
#   {surprise} ⚡서프라이즈 재료의 별명 (surprise 템플릿에서만)
#   {mix}      음료 별명 첫 글자 합체 (예: 콜라+우유+사이다 → 콜우사)
#   {no}       1~99 사이 번호
#
#  조사 자동 맞춤: 단어 바로 뒤에 {이/가} {을/를} {은/는} {와/과} {으로/로} 를 쓰면
#  받침에 맞게 바뀝니다.  예) "{surprise}{이/가} 나타났다" → "우유가 나타났다" / "물이 나타났다"
#
#  맛 이름: sweet(단맛) sour(신맛) fizzy(탄산) creamy(우유) bitter(쓴맛)
#           fruity(과일) salty(짠맛·이온) light(가볍고 맑음) grassy(풀내음·말차) default(그 외)
# ─────────────────────────────────────────────────────────────

templates:
  normal:
    - "{adj} {main} {suffix}"
    - "{place}의 {suffix}"
    - "{mood} {suffix} No.{no}"
    - "{mix} {suffix}"
    - "셰프의 {adj} {suffix}"
    - "{main}{와/과} 수상한 친구들"
    - "{adj} {mix}"
  surprise:
    - "배신의 {surprise} {suffix}"
    - "{main} 속 숨은 {surprise}"
    - "{surprise} 침입 사건"
    - "반전 {mix} {suffix}"
    - "{main}인 줄 알았지?"

adjectives:
  sweet: [달콤한, 꿀 떨어지는, 설탕 폭탄, 달달구리]
  sour: [새콤한, 시큼털털한, 입 오므라드는, 상큼 터지는]
  fizzy: [톡 쏘는, 부글부글, 팡팡 터지는, 기포 가득]
  creamy: [몽글몽글, 구름 같은, 보들보들, 우유빛]
  bitter: [씁쓸한, 어른의, 인생 같은, 쌉싸름한]
  fruity: [과즙 팡팡, 과일 폭탄, 상큼달콤, 과수원표]
  salty: [짭짤한, 이온 충전, 땀방울 같은, 바닷바람]
  light: [투명한, 맑디맑은, 밍밍한, 수상하게 맑은]
  grassy: [풀내음 가득, 초록초록, 녹차밭 같은]
  default: [수상한, 정체불명, 미스터리]

places:
  sweet: [사탕 공장, 디저트 왕국]
  sour: [레몬 왕국, 새콤 연구소]
  fizzy: [불꽃놀이, 탄산 화산]
  creamy: [구름 위, 아침 목장]
  bitter: [월요일 아침, 시험 기간]
  fruity: [과수원, 열대 섬]
  salty: [운동장, 바닷가]
  light: [오아시스, 고요한 호수]
  grassy: [녹차밭, 대나무 숲]
  default: [비밀 연구소, 셰프의 부엌]

suffixes:
  fizzy: [스파클러, 소다, 에이드]
  creamy: [라떼, 쉐이크, 스무디]
  bitter: [토닉, 엘릭서]
  sour: [펀치, 에이드]
  fruity: [펀치, 넥타]
  salty: [부스터, 회복약]
  light: [워터, 티]
  sweet: [시럽, 슬러시]
  grassy: [그린티, 말차샷]
  default: [포션, 묘약, 칵테일, 블렌드]

moods:
  harmony: [환상의, 찰떡궁합, 조화로운, 전설의]
  chaos: [혼돈의, 금지된, 정체불명, 카오스]

# 이름 공개 후 셰프의 한마디
taglines:
  harmony: ["의외로 맛있을지도?", "셰프가 자신 있게 추천해요!", "궁합 점수 높음!"]
  chaos: ["마시기 전 심호흡 필수!", "용기 있는 자만이 마실 수 있어요!", "맛은… 셰프도 장담 못 해요!"]
  surprise: ["⚡ {surprise}{이/가} 판을 뒤집었어요!", "⚡ {surprise}, 너 여기 왜 있어?"]

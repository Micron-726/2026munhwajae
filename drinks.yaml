# ─────────────────────────────────────────────────────────────
#  클로드 셰프의 수상한 음료 연구소 — 음료 목록
# ─────────────────────────────────────────────────────────────
#  여기에 음료를 자유롭게 추가 / 수정 / 숨김 처리할 수 있습니다.
#  저장 후 `npm run dev` 화면은 자동 새로고침되고,
#  dist/index.html 을 쓰는 경우 `npm run build` 를 다시 실행하세요.
#
#  항목 설명
#   id        (필수) 영문 소문자/숫자/하이픈. 음료마다 달라야 합니다.
#   name      (필수) 화면에 보일 한국어 이름
#   nickname  (선택) 이름 짓기에 쓰는 짧은 별명 (예: 포카리스웨트 → 포카리). 없으면 이름에서 " 주스"를 뗀 것
#   icon      (필수) 아이콘 모양: cup | glass | tall-glass | can | bottle | carton
#   color     (필수) 카드·그래프에 쓰는 대표 색 (#RRGGBB)
#   liquid    (선택) 아이콘 속 음료(또는 캔·병·팩 몸통) 색. 없으면 color 사용
#   label     (선택) 캔/병/팩에 적힐 짧은 영문 글자 (6자 이내 권장)
#   garnish   (선택) 잔 장식: none | ice | orange | lemon | apple | grape | peach
#   image     (선택) 실제 음료 사진. drink-images 폴더에 사진을 넣고 파일 이름만 적기
#             예) image: pocari.png   → 사진이 있으면 icon 대신 사진이 보입니다
#             (png/jpg/webp, 정사각형에 가까운 사진 권장, 흰 배경이면 가장 자연스러움)
#   description       (선택) 짧은 설명
#   containsCaffeine  (선택) 카페인 포함 여부 (true/false) — 실제 제품 라벨로 확인!
#   containsMilk      (선택) 우유 성분 포함 여부 (true/false) — 실제 제품 라벨로 확인!
#   hidden    (선택) true 로 두면 목록에서 잠시 숨깁니다 (재료 소진 시 편리)
#   flavor    (선택) 맛 프로필, 각 값 0~1. 궁합 모드의 "맛 임베딩"이 됩니다.
#             기본 축: sweet(단맛) sour(신맛) fizzy(탄산) creamy(우유·크림)
#                      bitter(쓴맛) fruity(과일) salty(짠맛·이온) light(가볍고 깔끔)
#             없는 축은 0. 새 축 이름(예: spicy)을 자유롭게 써도 자동으로 차원이 늘어납니다.
#
#  ※ 같은 음료가 한 레시피에 두 번 나오지 않으므로,
#    "최대 혼합 개수"보다 음료가 많아야 추첨할 수 있습니다.
# ─────────────────────────────────────────────────────────────

# 조합 방식
#   mode: harmony → 맛이 비슷한 음료끼리 잘 뭉치고, 가끔 ⚡서프라이즈 재료가 끼어듦
#   mode: random  → 맛 상관없이 완전 랜덤 (원래 명세서 방식)
mixing:
  mode: harmony
  harmony: 2        # β: 궁합 강도 (0 = 완전 랜덤, 클수록 비슷한 맛끼리 강하게 뭉침, 권장 1.5~3)
                    #    2 → 가장 잘 맞는 쌍이 균등 대비 약 5배, 가장 안 맞는 쌍은 약 0.2배
                    #    4 → 과일주스끼리만 계속 나와서 재미가 줄어듦
  surprise: 0.2     # ε: 한 레시피에 서프라이즈 재료가 끼어들 확률 (0.2 = 5번 중 1번꼴)
  surpriseNoise: 0.35   # σ: 서프라이즈 벡터의 무작위성 (0 = 항상 정반대 맛, 클수록 아무거나)

